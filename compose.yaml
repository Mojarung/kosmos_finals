services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        FLOODVALUE_COMMIT: ${FLOODVALUE_COMMIT:-}
    ports:
      - "${API_PORT:-18000}:8000"
    volumes:
      - live-observations:/app/data/live
      - runtime-observations:/app/data/runtime
      - operator-projects:/app/data/projects
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "${WEB_PORT:-18080}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  live-observations:
  runtime-observations:
  operator-projects:
