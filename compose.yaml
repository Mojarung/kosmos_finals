services:
  backend:
    environment:
      SKYFI_API_KEY: ${SKYFI_API_KEY:-}
      ETRIS_ACCESS_TOKEN: ${ETRIS_ACCESS_TOKEN:-}
      ETRIS_CLIENT_ID: ${ETRIS_CLIENT_ID:-}
      ETRIS_CLIENT_SECRET: ${ETRIS_CLIENT_SECRET:-}
      ETRIS_USERNAME: ${ETRIS_USERNAME:-}
      ETRIS_PASSWORD: ${ETRIS_PASSWORD:-}
      FLOODVALUE_GITVERSE_COMMIT: ${FLOODVALUE_GITVERSE_COMMIT:-}
      FLOODVALUE_GITVERSE_STATUS: ${FLOODVALUE_GITVERSE_STATUS:-}
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        FLOODVALUE_COMMIT: ${FLOODVALUE_COMMIT:?Use scripts/compose.sh or pass the exact Git commit}
    ports:
      - "${API_PORT:-18000}:8000"
    volumes:
      - live-observations:/app/data/live
      - runtime-observations:/app/data/runtime
      - operator-projects:/app/data/projects
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "${WEB_PORT:-18080}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  live-observations:
  runtime-observations:
  operator-projects:
