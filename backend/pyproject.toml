[project]
name = "floodvalue-api"
version = "0.1.0"
description = "Operator planning API for the FloodValue hackathon"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pyproj>=3.7,<4",
  "numpy>=2,<3",
  "shapely>=2,<3",
]

[project.optional-dependencies]
demo = ["rasterio>=1.4,<2", "pillow>=11,<13"]
test = ["pytest>=8,<10", "httpx>=0.28,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
