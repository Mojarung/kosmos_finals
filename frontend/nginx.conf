server {
    client_max_body_size 110m;
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Scripts, the place list for the map search and API JSON compress 3-4 times.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types application/javascript text/css application/json application/geo+json image/svg+xml text/plain;

    # Imagery bought from a supplier comes file by file from a folder, up to 2 GB each.
    location /api/procurement/deliveries/ {
        client_max_body_size 2100m;
        proxy_request_buffering off;
        proxy_pass http://backend:8000;
        proxy_read_timeout 600s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_read_timeout 240s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Vite puts a content hash in every asset name, so a browser may keep them for good.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
